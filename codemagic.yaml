# Codemagic CI — builds the iOS shell on a cloud Mac and ships it to TestFlight.
#
# One-time setup in the Codemagic UI (no secrets live in this file):
#   1. Add this repo as an application (GitHub integration).
#   2. Team settings -> Integrations -> Developer Portal -> add the App Store
#      Connect API key: name it exactly "Codemagic" (matches integrations
#      below), Issuer ID a6c12d1a-f526-41d8-9480-0d76904a6db7, Key ID
#      5VG22AT57Q, upload AuthKey_5VG22AT57Q.p8.
#   3. Start the "ios-testflight" workflow. Signing certs + profiles are
#      created/managed automatically from that API key (Team 47JHV3522G).
workflows:
  ios-testflight:
    name: iOS — TestFlight
    instance_type: mac_mini_m2
    max_build_duration: 60
    integrations:
      app_store_connect: Codemagic
    environment:
      groups:
        - appstore_credentials   # holds CERTIFICATE_PRIVATE_KEY (set in the Codemagic UI)
      node: 22.16.0
      xcode: latest
      vars:
        XCODE_PROJECT: ios/App/App.xcodeproj
        XCODE_SCHEME: App
    triggering:
      events: []   # manual builds only for now — start from the Codemagic UI
    scripts:
      - name: Install npm dependencies
        script: npm ci
      - name: Build web assets
        script: npm run build
      - name: Capacitor sync
        script: npx cap sync ios
      # Deterministic signing — no fetching/matching magic. The public cert +
      # provisioning profile are committed in ios/certs/ (not secrets); only
      # CERTIFICATE_PRIVATE_KEY (Codemagic secure env var) completes the pair.
      # Both expire 2027-07-30 — re-download via the ASC API then.
      - name: Set up code signing
        script: |
          set -e
          echo "$CERTIFICATE_PRIVATE_KEY" > /tmp/cert_key.pem
          echo "Key header in env var: $(head -1 /tmp/cert_key.pem)"
          if ! head -1 /tmp/cert_key.pem | grep -q "BEGIN \(RSA \)\?PRIVATE KEY"; then
            echo "ERROR: CERTIFICATE_PRIVATE_KEY does not contain the expected key."
            echo "Expected first line: -----BEGIN PRIVATE KEY-----"
            echo "Re-paste the FULL contents of Downloads/apple-distribution-cert-private-key.pem (28 lines)."
            exit 1
          fi
          openssl x509 -inform DER -in ios/certs/distribution.cer -out /tmp/cert.pem
          CERT_MOD=$(openssl x509 -noout -modulus -in /tmp/cert.pem)
          KEY_MOD=$(openssl rsa -noout -modulus -in /tmp/cert_key.pem)
          if [ "$CERT_MOD" != "$KEY_MOD" ]; then
            echo "ERROR: CERTIFICATE_PRIVATE_KEY env var does not match ios/certs/distribution.cer"
            echo "Paste the full contents of apple-distribution-cert-private-key.pem into the Codemagic env var (group appstore_credentials)."
            exit 1
          fi
          openssl pkcs12 -export -inkey /tmp/cert_key.pem -in /tmp/cert.pem -out /tmp/cert.p12 -password pass:buildpass
          keychain initialize
          keychain add-certificates --certificate /tmp/cert.p12 --certificate-password buildpass
          mkdir -p ~/Library/MobileDevice/"Provisioning Profiles"
          cp ios/certs/GHQ_App_Store.mobileprovision ~/Library/MobileDevice/"Provisioning Profiles"/
          # Export options for the IPA step — a committed file, copied verbatim
          # (a heredoc here got mangled on the build machine once; never again)
          cp ios/certs/export_options.plist ~/export_options.plist
          plutil -lint ~/export_options.plist
          echo "===== signing identities in keychain ====="
          security find-identity -v -p codesigning
          echo "===== provisioning profiles installed ====="
          ls -la ~/Library/MobileDevice/"Provisioning Profiles"/
      - name: Stamp build number
        script: |
          cd ios/App
          agvtool new-version -all $BUILD_NUMBER
      # On failure, surface the actual xcodebuild error lines right in the
      # step output instead of burying them in the artifacts zip.
      - name: Build IPA
        script: |
          echo "===== export_options.plist first bytes (hex) ====="
          xxd ~/export_options.plist | head -5
          plutil -lint ~/export_options.plist
          python3 -c "import plistlib; print('plistlib OK:', plistlib.load(open('$HOME/export_options.plist','rb')))"
          xcode-project build-ipa --project "$XCODE_PROJECT" --scheme "$XCODE_SCHEME" || {
            echo "===== xcodebuild error lines ====="
            grep -h "error: " /tmp/xcodebuild_logs/*.log | tail -n 60 || true
            echo "===== last 120 log lines ====="
            tail -n 120 /tmp/xcodebuild_logs/*.log || true
            exit 1
          }
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
