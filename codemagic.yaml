# Codemagic CI — builds the iOS shell on a cloud Mac and ships it to TestFlight.
#
# One-time setup in the Codemagic UI (no secrets live in this file):
#   1. Add this repo as an application (GitHub integration).
#   2. Team settings -> Integrations -> Developer Portal -> add the App Store
#      Connect API key: name it exactly "Codemagic" (matches integrations
#      below), Issuer ID a6c12d1a-f526-41d8-9480-0d76904a6db7, Key ID
#      5VG22AT57Q, upload AuthKey_5VG22AT57Q.p8.
#   3. Start the "ios-testflight" workflow. Signing certs + profiles are
#      created/managed automatically from that API key (Team 47JHV3522G).
workflows:
  ios-testflight:
    name: iOS — TestFlight
    instance_type: mac_mini_m2
    max_build_duration: 60
    integrations:
      app_store_connect: Codemagic
    environment:
      groups:
        - appstore_credentials   # holds CERTIFICATE_PRIVATE_KEY (set in the Codemagic UI)
      node: 22.16.0
      xcode: latest
      vars:
        XCODE_PROJECT: ios/App/App.xcodeproj
        XCODE_SCHEME: App
    triggering:
      events: []   # manual builds only for now — start from the Codemagic UI
    scripts:
      - name: Install npm dependencies
        script: npm ci
      - name: Build web assets
        script: npm run build
      - name: Capacitor sync
        script: npx cap sync ios
      # Explicit signing: the Apple Distribution certificate + "GHQ App Store"
      # profile already exist (created 2026-07-30 via the ASC API); the CLI
      # matches the certificate by CERTIFICATE_PRIVATE_KEY and --create
      # regenerates anything that expires.
      - name: Set up code signing
        script: |
          keychain initialize
          app-store-connect fetch-signing-files "app.ghvac.tools" --type IOS_APP_STORE --create
          keychain add-certificates
          xcode-project use-profiles
          echo "===== signing identities in keychain ====="
          security find-identity -v -p codesigning || true
          echo "===== provisioning profiles installed ====="
          ls -la ~/Library/"MobileDevice"/"Provisioning Profiles"/ || true
      - name: Stamp build number
        script: |
          cd ios/App
          agvtool new-version -all $BUILD_NUMBER
      # On failure, surface the actual xcodebuild error lines right in the
      # step output instead of burying them in the artifacts zip.
      - name: Build IPA
        script: |
          xcode-project build-ipa --project "$XCODE_PROJECT" --scheme "$XCODE_SCHEME" || {
            echo "===== xcodebuild error lines ====="
            grep -h "error: " /tmp/xcodebuild_logs/*.log | tail -n 60 || true
            echo "===== last 120 log lines ====="
            tail -n 120 /tmp/xcodebuild_logs/*.log || true
            exit 1
          }
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
